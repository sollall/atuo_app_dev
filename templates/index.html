<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Door Kicker Debug</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div id="ui-bar">
        <button id="btn-new">NEW GAME</button>
        <button id="btn-execute">▶ EXECUTE</button>
        <button id="btn-reset">RESET PATHS</button>
        <button id="btn-clear">CLEAR SEL</button>
        <span id="status">
            <span class="label">PHASE</span><span id="status-phase">PLANNING</span>
            &ensp;
            <span class="label">ENEMIES</span><span id="status-enemies">6</span>
            &ensp;
            <span class="label">UNITS</span><span id="status-units">2</span>
        </span>
    </div>
    <div id="canvas-container">
        <canvas id="gameCanvas"></canvas>
    </div>
    <div id="hint-bar"><span id="hint">青い隊員をクリック/タップして選択 → ドラッグで経路を引く → ▶ EXECUTE</span></div>
    <script src="/static/js/game.js"></script>
</body>
</html>
